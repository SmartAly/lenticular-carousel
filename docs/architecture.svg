<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Lenticular Carousel 模块架构</title>
  <desc id="archDesc">动效模块与卡片模块零互依，由装配层 main.js 接线；两者仅通过 element、setActive、onChange 三个通道通信。</desc>
  <style>
    .ttl { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mini { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .eff-c { fill: var(--eff-c); stroke: var(--eff-s); stroke-width: 0.5; }
    .eff-b { fill: var(--eff-b); stroke: var(--eff-s); stroke-width: 0.5; }
    .eff-ttl { fill: var(--eff-t); }
    .eff-sub { fill: var(--eff-sub); }
    .lay-c { fill: var(--lay-c); stroke: var(--lay-s); stroke-width: 0.5; }
    .lay-b { fill: var(--lay-b); stroke: var(--lay-s); stroke-width: 0.5; }
    .lay-ttl { fill: var(--lay-t); }
    .lay-sub { fill: var(--lay-sub); }
    .asm-c { fill: var(--asm-c); stroke: var(--asm-s); stroke-width: 0.5; }
    .asm-ttl { fill: var(--asm-t); }
    .asm-sub { fill: var(--asm-sub); }
    .arr { stroke: var(--c-arr); stroke-width: 1.5; fill: none; }
    .lbl { fill: var(--c-lbl); }
    text { dominant-baseline: central; }
    :root {
      --eff-c: #EEEDFE; --eff-b: #CECBF6; --eff-s: #534AB7; --eff-t: #3C3489; --eff-sub: #534AB7;
      --lay-c: #E1F5EE; --lay-b: #9FE1CB; --lay-s: #0F6E56; --lay-t: #085041; --lay-sub: #0F6E56;
      --asm-c: #F1EFE8; --asm-s: #5F5E5A; --asm-t: #444441; --asm-sub: #5F5E5A;
      --c-arr: #5F5E5A; --c-lbl: #5F5E5A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --eff-c: #26215C; --eff-b: #3C3489; --eff-s: #AFA9EC; --eff-t: #CECBF6; --eff-sub: #AFA9EC;
        --lay-c: #04342C; --lay-b: #085041; --lay-s: #5DCAA5; --lay-t: #9FE1CB; --lay-sub: #5DCAA5;
        --asm-c: #2C2C2A; --asm-s: #B4B2A9; --asm-t: #D3D1C7; --asm-sub: #B4B2A9;
        --c-arr: #888780; --c-lbl: #B4B2A9;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="eff-c" x="40" y="40" width="280" height="200" rx="16"/>
  <text class="ttl eff-ttl" x="56" y="64">动效模块 · lenticular-card.js</text>
  <rect class="eff-b" x="56" y="84" width="248" height="48" rx="8"/>
  <text class="ttl eff-ttl" x="180" y="100" text-anchor="middle">LenticularRenderer</text>
  <text class="sub eff-sub" x="180" y="118" text-anchor="middle">纯 Canvas 绘制 · 无 DOM 依赖</text>
  <path class="arr" d="M180 132 L180 146" marker-end="url(#arrow)"/>
  <rect class="eff-b" x="56" y="148" width="248" height="64" rx="8"/>
  <text class="ttl eff-ttl" x="180" y="166" text-anchor="middle">LenticularCard</text>
  <text class="sub eff-sub" x="180" y="184" text-anchor="middle">指针追踪 · rAF 插值 · 3D 变换</text>
  <text class="sub eff-sub" x="180" y="202" text-anchor="middle">文字揭示编排</text>

  <rect class="lay-c" x="400" y="40" width="240" height="200" rx="16"/>
  <text class="ttl lay-ttl" x="412" y="64">卡片模块 · carousel.js</text>
  <rect class="lay-b" x="416" y="110" width="208" height="80" rx="8"/>
  <text class="ttl lay-ttl" x="520" y="130" text-anchor="middle">Carousel</text>
  <text class="sub lay-sub" x="520" y="150" text-anchor="middle">轨道 · 导航 · 分页点</text>
  <text class="sub lay-sub" x="520" y="168" text-anchor="middle">激活层级 dimming</text>

  <path class="arr" d="M304 150 L414 142" marker-end="url(#arrow)"/>
  <text class="sub lbl" x="360" y="132" text-anchor="middle">element</text>
  <path class="arr" d="M414 182 L304 190" marker-end="url(#arrow)"/>
  <text class="mini lbl" x="360" y="208" text-anchor="middle">setActive / onChange</text>

  <path class="arr" d="M180 278 L180 242" marker-end="url(#arrow)"/>
  <text class="mini lbl" x="180" y="262" text-anchor="middle">new LenticularCard</text>
  <path class="arr" d="M520 278 L520 242" marker-end="url(#arrow)"/>
  <text class="mini lbl" x="520" y="262" text-anchor="middle">add(element)</text>

  <rect class="asm-c" x="40" y="280" width="600" height="56" rx="12"/>
  <text class="ttl asm-ttl" x="340" y="300" text-anchor="middle">装配层 · main.js</text>
  <text class="sub asm-sub" x="340" y="320" text-anchor="middle">数据 · 调参面板 · 预设 · 分解视图 · 弹窗</text>
</svg>
